<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>For You 🌸</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="scene">
      <!-- =========================
             BACKGROUND
        ========================== -->

      <div class="stars"></div>

      <div class="stars-small"></div>

      <div class="moon">
        <div class="moon-crater crater-one"></div>

        <div class="moon-crater crater-two"></div>

        <div class="moon-crater crater-three"></div>
      </div>

      <!-- =========================
             MESSAGE AREA
        ========================== -->

      <section class="message">
        <p class="small-title">A LITTLE SOMETHING</p>

        <h1>
          For You
          <span>🌸</span>
        </h1>

        <div class="message-box" id="messageBox">
          <p id="messageText">Something is waiting for you...</p>
        </div>

        <button id="boostButton">
          <span class="button-icon"> ✨ </span>

          <span class="button-text"> Open the flower </span>
        </button>
      </section>

      <!-- =========================
             FLOWER
        ========================== -->

      <div class="flower">
        <!-- Soft glow -->

        <div class="flower-glow"></div>

        <!-- Stem -->

        <div class="stem"></div>

        <!-- Leaves -->

        <div class="leaf leaf-left"></div>

        <div class="leaf leaf-right"></div>

        <!-- Flower head -->

        <!-- Flower head -->

        <div class="flower-head">
          <div class="petal petal-1"></div>

          <div class="petal petal-2"></div>

          <div class="petal petal-3"></div>

          <div class="petal petal-4"></div>

          <div class="petal petal-5"></div>

          <div class="center">
            <div class="center-dot"></div>
          </div>
        </div>
      </div>

      <!-- =========================
             GROUND
        ========================== -->

      <div class="ground">
        <div class="ground-light"></div>
      </div>

      <!-- =========================
             SPARKLES
        ========================== -->

      <div class="particles">
        <span>✦</span>

        <span>✧</span>

        <span>✦</span>

        <span>·</span>

        <span>✧</span>

        <span>·</span>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
